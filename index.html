<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>B.U.G - Build Your Genie</title>

    <!-- SEO Meta Tags -->
    <meta
      name="description"
      content="B.U.G - Build Your Genie. Premium web development agency crafting innovative digital experiences."
    />
    <meta name="theme-color" content="#0b0d10" />

    <!-- Preconnect to external resources (faster DNS resolution) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Preload critical fonts (Inter for body, Space Grotesk for headings) -->
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
      as="style"
      onload="
        this.onload = null;
        this.rel = 'stylesheet';
      "
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <!-- Full font weights (loaded after initial render) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
    />

    <!-- Material Symbols (deferred loading) -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
      media="print"
      onload="this.media = 'all'"
    />

    <!-- Critical CSS for above-the-fold content -->
    <style>
      /* Prevent FOUC (Flash of Unstyled Content) */
      html {
        background-color: #0b0d10;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #0b0d10;
        color: #e6e6e6;
        font-family:
          "Inter",
          system-ui,
          -apple-system,
          sans-serif;
      }
      /* Initial loader styles */
      #root:empty::before {
        content: "";
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #0b0d10;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
